name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_icon.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TODOes --icon assets/todoes.ico --add-data "assets/todoes.svg;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: TODOes-Windows
          path: dist/TODOes.exe
          if-no-files-found: error
